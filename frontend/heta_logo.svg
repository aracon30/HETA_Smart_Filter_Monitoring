<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 52" fill="none">
  <!-- Filter housing -->
  <rect x="4" y="4" width="36" height="44" rx="6"
        stroke="white" stroke-width="2"
        fill="rgba(255,255,255,0.08)"/>
  <!-- Filter media layers (decreasing width) -->
  <line x1="10" y1="15" x2="34" y2="15" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="13" y1="23" x2="31" y2="23" stroke="white" stroke-width="2"   stroke-linecap="round"/>
  <line x1="17" y1="31" x2="27" y2="31" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Outlet dot -->
  <circle cx="22" cy="41" r="2.8" fill="rgba(255,255,255,0.85)"/>
  <!-- HETA wordmark -->
  <text x="50" y="34"
        font-family="'Segoe UI','Arial',sans-serif"
        font-weight="800"
        font-size="28"
        letter-spacing="2"
        fill="white">HETA</text>
</svg>
