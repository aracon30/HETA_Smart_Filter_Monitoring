name: Lint

on:
  push:
    paths:
      - "backend/**/*.py"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "backend/**/*.py"
      - "pyproject.toml"

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Check (lint)
        run: ruff check backend/

      - name: Check (format)
        run: ruff format --check backend/
